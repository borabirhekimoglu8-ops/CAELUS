<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="CAELUS Open-Spiral Holographic Brand Symbol">
  <defs>
    <radialGradient id="caelusBgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#040812" stop-opacity="0.96"/>
      <stop offset="26%" stop-color="#071124" stop-opacity="0.92"/>
      <stop offset="68%" stop-color="#0B1933" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#040812" stop-opacity="0.98"/>
    </radialGradient>
    <linearGradient id="caelusIceBlue" x1="12%" y1="8%" x2="88%" y2="92%">
      <stop offset="0%" stop-color="#E6F6FF"/>
      <stop offset="38%" stop-color="#88D4FF"/>
      <stop offset="78%" stop-color="#3898EC"/>
