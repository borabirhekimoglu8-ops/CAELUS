      <stop offset="55%" stop-color="#4BA8E8" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#0E2240" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="caelusGoldEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6E3BA" stop-opacity="0.92"/>
      <stop offset="55%" stop-color="#E6C387" stop-opacity="0.68"/>
      <stop offset="100%" stop-color="#88D4FF" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="caelusHologramGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

