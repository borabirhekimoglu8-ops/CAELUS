name: Deploy iPhone War Room

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: caelus-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build WASM and deploy GitHub Pages
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out the CI-verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install WebAssembly target
        run: rustup target add wasm32-unknown-unknown

      - name: Build deterministic browser engine
        env:
          RUSTFLAGS: "-D warnings"
        run: >-
          cargo build --release --locked
          --manifest-path caelus_wasm/Cargo.toml
          --target wasm32-unknown-unknown

      - name: Validate universal scenario compiler and agent studio
        env:
          CAELUS_OFFLINE_ONLY: "1"
          # pages.yml builds only caelus_wasm.wasm (no native C++17 dist/caelus_os binary).
          # Native C++17 binary tests (e.g., Test 37 REPL filesystem save_world/load_world)
          # are strictly enforced in ci.yml on both Linux and Windows via CAELUS_REQUIRE_NATIVE_BIN="1".
          CAELUS_WASM_ONLY: "1"
        run: |
          node --check ui/scenario_compiler.js
          node --check ui/living_world_model.js
          node --check ui/discovery_value_engine.js
          node --check ui/first_real_task_engine.js
          node --check ui/personal_agent_and_advisor.js
          node --check ui/war_room_i18n.js
          node --check ui/sidecar_airlock_mcp.js
          node --check ui/war_room_ag_ui_engine.js
          node --check ui/war_room_cockpit.js
          node --check ui/spatial_experience.js
          node --check ui/app.js
          node --test tests/universal_scenario_compiler.test.mjs
          node --test tests/living_world_model.test.mjs
          node --test tests/discovery_value_engine.test.mjs
          node --test tests/first_real_task.test.mjs
          node --test tests/personal_agent_and_advisor.test.mjs
          node --test tests/test_i18n_and_plain_mode_parity.mjs
          node --test tests/test_war_room_master_gates.mjs
          node --test tests/universal_wasm_scenario.test.mjs

      - name: Assemble offline-first iPhone PWA package
        run: python3 tools/build_standalone.py

      - name: Validate deploy artifact and subpath (/CAELUS/) PWA contract
        run: |
          test -s dist/index.html
          test -s dist/caelus_standalone.html
          test -s dist/caelus_wasm.wasm
          test -s dist/manifest.webmanifest
          test -s dist/sw.js
          test -f dist/.nojekyll
          grep -q 'CAELUS_WASM_B64' dist/index.html
          grep -q 'manifest.webmanifest' dist/index.html
          grep -q 'apple-mobile-web-app-capable' dist/index.html
          grep -q "serviceWorker.register('./sw.js'" dist/index.html
          grep -q 'CaelusScenarioCompiler' dist/index.html
          grep -q 'CaelusLivingWorldModel' dist/index.html
          grep -q 'CaelusDiscoveryValueEngine' dist/index.html
          grep -q 'CaelusFirstRealTaskEngine' dist/index.html
          grep -q 'CaelusConversationalAdvisor' dist/index.html
          grep -q 'CaelusPersonalAgentStudio' dist/index.html
          grep -q 'CaelusWorldDataGate' dist/index.html
          grep -q 'CaelusSpatialExperience' dist/index.html
          grep -q 'CaelusTwelveCapabilitiesSuite' dist/index.html
          grep -q 'caelus-world-impact-engine-workspace' dist/index.html
          grep -q 'caelus-living-world-model-workspace' dist/index.html
          grep -q 'caelus-discovery-value-engine-workspace' dist/index.html
          grep -q 'BS-01_SAHTE_UFUK' dist/index.html
          grep -q 'BS-02_GOLGE_ARSIV' dist/index.html
          grep -q 'BS-03_KUM_SAATI' dist/index.html
          ! grep -Eq '(src|href)=["'\'']/[^/]' dist/index.html
          node --test tests/spatial_interface.test.mjs

      - name: Upload offline-first standalone bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: caelus-pages-dist
          path: dist
          if-no-files-found: error

      - name: Configure GitHub Pages
        id: configure_pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
