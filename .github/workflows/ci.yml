name: CI

on:
  push:
    branches: [main, "claude/**", "feat/**"]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux full pipeline (ci.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Python verifier dependencies
        run: python3 -m pip install --upgrade blake3 cryptography

      - name: Toolchain versions
        run: |
          rustc --version
          cargo --version
          g++ --version | head -1
          python3 --version
          node --version

      - name: Fetch dependencies for the offline dataset test
        run: cargo fetch --locked --manifest-path caelus_core/Cargo.toml

      - name: Run full CI pipeline (builds CAELUS_PRODUCTION=1 dist/caelus_os and verifies C++/Rust/Neural/Airlock/WarRoom)
        run: bash ./ci.sh

      - name: Extract deterministic CDET block (UTF-8 LF)
        run: |
          tmp_dir="$(mktemp -d)"
          (
            cd "$tmp_dir"
            "$GITHUB_WORKSPACE/dist/caelus_os" --scenario UNIVERSAL_BASELINE --det-mode
          ) | grep -E '^CDET:' > cdet-linux.txt
          rm -rf "$tmp_dir"
          wc -l cdet-linux.txt

      - name: Upload CDET artifact
        uses: actions/upload-artifact@v4
        with:
          name: cdet-linux
          path: cdet-linux.txt
          if-no-files-found: error

      - name: Upload Linux production binary
        uses: actions/upload-artifact@v4
        with:
          name: caelus_os-linux
          path: dist/caelus_os
          if-no-files-found: error

      - name: Validate universal browser scenario compiler, War Room AG-UI, Airlock MCP & NCM-2 against native Linux binary
        env:
          CAELUS_OFFLINE_ONLY: "1"
          CAELUS_REQUIRE_NATIVE_BIN: "1"
        run: |
          CAELUS_SKIP_RUST=1 bash ./build.sh
          rustup target add wasm32-unknown-unknown
          cargo build --locked --manifest-path caelus_wasm/Cargo.toml --target wasm32-unknown-unknown --release
          node --check ui/scenario_compiler.js
          node --check ui/living_world_model.js
          node --check ui/discovery_value_engine.js
          node --check ui/first_real_task_engine.js
          node --check ui/personal_agent_and_advisor.js
          node --check ui/sidecar_airlock_mcp.js
          node --check ui/war_room_ag_ui_engine.js
          node --check ui/war_room_cockpit.js
          node --check ui/spatial_experience.js
          node --check ui/app.js
          node --check tools/caelus_mcp_server.mjs
          node --check tools/caelus_ag_ui_ws_server.mjs
          node --test tests/universal_scenario_compiler.test.mjs
          node --test tests/living_world_model.test.mjs
          node --test tests/discovery_value_engine.test.mjs
          node --test tests/first_real_task.test.mjs
          node --test tests/personal_agent_and_advisor.test.mjs
          node tools/caelus_mcp_server.mjs --self-test
          node --test tests/test_war_room_master_gates.mjs
          node --test apps/caelus-ncm-mobile/tests/ncm2-quality.test.mjs
          node --test tests/universal_wasm_scenario.test.mjs

  windows:
    name: Windows full pipeline (ci.bat, MSVC)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Verus-pinned Rust toolchain
        run: rustup toolchain install 1.95.0-x86_64-pc-windows-msvc --no-self-update --profile minimal

      - name: Install Python verifier dependencies
        run: py -3 -m pip install --upgrade blake3 cryptography

      - name: Toolchain versions
        shell: cmd
        run: |
          rustc --version
          cargo --version
          where cl.exe
          py -3 --version
          node --version

      - name: Fetch dependencies for the offline dataset test
        run: cargo fetch --locked --manifest-path caelus_core/Cargo.toml

      - name: Run full CI pipeline (builds CAELUS_PRODUCTION=1 dist\caelus_os.exe and verifies C++/Rust/Neural/Airlock/WarRoom)
        shell: cmd
        env:
          CAELUS_CXX: MSVC
          PYTHONUTF8: "1"
        run: |
          call ci.bat
          if errorlevel 1 exit /b 1

      - name: Extract deterministic CDET block (pure UTF-8 LF, no BOM)
        shell: pwsh
        run: |
          $tmpDir = Join-Path ([System.IO.Path]::GetTempPath()) "caelus_cdet_extract"
          if (Test-Path $tmpDir) { Remove-Item -Recurse -Force $tmpDir }
          New-Item -ItemType Directory -Path $tmpDir | Out-Null
          Push-Location $tmpDir
          try {
            $out = & "$env:GITHUB_WORKSPACE\dist\caelus_os.exe" --scenario UNIVERSAL_BASELINE --det-mode 2>&1
          } finally {
            Pop-Location
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $tmpDir
          }
          $cdetLines = $out | ForEach-Object { $_.ToString().TrimEnd("`r") } | Where-Object { $_ -match '^CDET:' }
          if (-not $cdetLines -or $cdetLines.Count -eq 0) {
            throw "No CDET lines emitted by dist\caelus_os.exe"
          }
          $lfText = ($cdetLines -join "`n") + "`n"
          [System.IO.File]::WriteAllText("$env:GITHUB_WORKSPACE\cdet-windows.txt", $lfText, [System.Text.UTF8Encoding]::new($false))
          Write-Host "Extracted $($cdetLines.Count) CDET lines (pure UTF-8 LF)"

      - name: Upload CDET artifact
        uses: actions/upload-artifact@v4
        with:
          name: cdet-windows
          path: cdet-windows.txt
          if-no-files-found: error

      - name: Upload Windows production binary
        uses: actions/upload-artifact@v4
        with:
          name: caelus_os-windows
          path: dist/caelus_os.exe
          if-no-files-found: error

      - name: Validate universal browser scenario compiler, War Room AG-UI, Airlock MCP & NCM-2 against native Windows binary
        shell: pwsh
        env:
          CAELUS_OFFLINE_ONLY: "1"
          CAELUS_REQUIRE_NATIVE_BIN: "1"
          CAELUS_CXX: "MSVC"
          CAELUS_SKIP_RUST: "1"
        run: |
          cmd.exe /c "call build.bat"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup target add wasm32-unknown-unknown
          cargo build --locked --manifest-path caelus_wasm/Cargo.toml --target wasm32-unknown-unknown --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check ui/scenario_compiler.js
          node --check ui/living_world_model.js
          node --check ui/discovery_value_engine.js
          node --check ui/first_real_task_engine.js
          node --check ui/personal_agent_and_advisor.js
          node --check ui/sidecar_airlock_mcp.js
          node --check ui/war_room_ag_ui_engine.js
          node --check ui/war_room_cockpit.js
          node --check ui/spatial_experience.js
          node --check ui/app.js
          node --check tools/caelus_mcp_server.mjs
          node --check tools/caelus_ag_ui_ws_server.mjs
          node --test tests/universal_scenario_compiler.test.mjs
          node --test tests/living_world_model.test.mjs
          node --test tests/discovery_value_engine.test.mjs
          node --test tests/first_real_task.test.mjs
          node --test tests/personal_agent_and_advisor.test.mjs
          node tools/caelus_mcp_server.mjs --self-test
          node --test tests/test_war_room_master_gates.mjs
          node --test apps/caelus-ncm-mobile/tests/ncm2-quality.test.mjs
          node --test tests/universal_wasm_scenario.test.mjs
          Remove-Item -Force -ErrorAction SilentlyContinue caelus_audit_*.log

  cross-platform-determinism:
    name: Cross-platform CDET equality
    runs-on: ubuntu-latest
    needs: [linux, windows]
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cdet-*
          merge-multiple: true

      - name: Compare CDET blocks bit-for-bit
        run: |
          echo "--- linux ---";   cat cdet-linux.txt
          echo "--- windows ---"; cat cdet-windows.txt
          cmp cdet-linux.txt cdet-windows.txt
          echo "CDET blocks are 100% bit-identical across Linux and Windows (pure UTF-8 LF)."
