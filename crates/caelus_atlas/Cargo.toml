[package]
name = "caelus_atlas"
version = "0.9.1"
edition = "2021"
publish = false
description = "CAELUS OS Living Global Maritime Database (Zero-Copy rkyv + memmap2, Oxigraph SPO, XTDB Bitemporal, O(Delta) Sync)"

[dependencies]
caelus_core = { path = "../caelus_core" }
memmap2 = "0.9"
oxigraph = { version = "0.5", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "native-tls", "gzip"] }
rkyv = "0.8"
rmcp = { version = "3.10.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
