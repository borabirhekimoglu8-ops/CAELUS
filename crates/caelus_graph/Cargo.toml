[package]
name = "caelus_graph"
version = "0.9.1"
edition = "2021"
publish = false
description = "CAELUS OS XTDB bitemporal compare, Oxigraph pure-Rust SPO store, and streaming UN/LOCODE + SMDG index"

[dependencies]
caelus_core = { path = "../caelus_core" }
oxigraph = { version = "0.5", default-features = false }
rkyv = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
