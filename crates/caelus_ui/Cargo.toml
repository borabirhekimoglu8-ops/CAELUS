[package]
name = "caelus_ui"
version = "0.9.1"
edition = "2021"
publish = false
description = "CAELUS OS Zero-WDDM Software-Rasterized Spatial Shell (winit + softbuffer + tiny-skia, Warm Swiss Cartography)"

[dependencies]
caelus_atlas = { path = "../caelus_atlas" }
caelus_core = { path = "../caelus_core" }
caelus_ingest = { path = "../caelus_ingest" }
caelus_graph = { path = "../caelus_graph" }
caelus_mcp = { path = "../caelus_mcp" }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
softbuffer = "0.4"
tiny-skia = "0.11"
usvg = { version = "0.45", default-features = false }
resvg = { version = "0.45", default-features = false }
rayon = "1.10"
