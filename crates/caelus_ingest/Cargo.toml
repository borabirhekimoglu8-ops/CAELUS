[package]
name = "caelus_ingest"
version = "0.9.1"
edition = "2021"
publish = false
description = "CAELUS OS 17-feed live & offline cached telemetry ingestor with 64-byte aligned rkyv + memmap2 ring"

[dependencies]
caelus_core = { path = "../caelus_core" }
memmap2 = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "native-tls"] }
rkyv = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
