[advisories]
ignore = [
    { id = "RUSTSEC-2026-0194", reason = "Pinned transitively by oxigraph 0.5.13; CAELUS never parses untrusted external XML" },
    { id = "RUSTSEC-2026-0195", reason = "Pinned transitively by oxigraph 0.5.13; NsReader is never exposed to untrusted external XML" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
